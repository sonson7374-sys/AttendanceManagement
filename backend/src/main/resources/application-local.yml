spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${POSTGRES_DB:attendance}?sslmode=${DB_SSL_MODE:disable}
    username: ${POSTGRES_USER:attendance}
    password: ${POSTGRES_PASSWORD:local_dev_password_change_me}
  jpa:
    properties:
      hibernate:
        format_sql: true
  data:
    redis:
      port: ${REDIS_PORT:6380}
      password: ${REDIS_PASSWORD:local_redis_password_change_me}

logging:
  level:
    com.attendance: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
